# lemmax: its own tests, then lint of every opted-in requirements file, on
# every push and pull request; hooks can be skipped, this cannot.
# lemma: 01a202f3-86d9-7db2-a0dc-accec28dfe29
name: lemmax
on:
  push:
  pull_request:
jobs:
  lemmax:
    runs-on: ubuntu-latest
    env:
      # setup-emacs builds Emacs with Nix flakes, off on the runner's Nix.
      NIX_CONFIG: experimental-features = nix-command flakes
    strategy:
      fail-fast: false
      matrix:
        # The floor (lemmax.el checks for 29), the newest release, and its branch.
        # lemma: 01a202f3-863b-7c04-9728-0c9dd9346002
        emacs_version: ["29.4", "30.1", "release-snapshot"]
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@v6.0
        with:
          version: ${{ matrix.emacs_version }}
      - name: tests
        run: requirements/scripts/lemmax/run_tests
      - name: lint
        run: requirements/scripts/lemmax/lemmax lint
