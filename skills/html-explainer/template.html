<!doctype html>
<!--
  html-explainer template.
  Fill content placeholders; builder supplies DIAGRAMS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.65 ui-monospace, Menlo, monospace; background: #17181c; color: #d5d8dd; margin: 0; padding: 32px 20px 80px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #8b919b; margin-bottom: 24px; }
  h2 { font-size: 15px; margin: 28px 0 8px; color: #aeb4bd; text-transform: uppercase; letter-spacing: 1px; }
  h3 { font-size: 14px; margin: 18px 0 6px; }

  .tldr { background: #1d2026; border: 1px solid #2d77e0; border-left: 4px solid #2d77e0; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  .callout { border-radius: 8px; padding: 10px 14px; margin: 12px 0; border: 1px solid; }
  .callout.info { border-color: #2d77e0; background: #1d2430; }
  .callout.warn { border-color: #febc38; background: #2a251b; }
  .callout.error { border-color: #ff5b5b; background: #2a1d1d; }
  .callout.ok { border-color: #89d281; background: #1c261c; }

  details.more { margin: 8px 0; border: 1px solid #26292f; border-radius: 8px; background: #1d2026; }
  details.more > summary { cursor: pointer; padding: 8px 14px; color: #8fb7f5; font-weight: bold; }
  details.more > div { padding: 0 14px 12px; }

  pre { background: #101114; border: 1px solid #26292f; border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 13px; }
  code { font-family: inherit; }
  mark { background: #febc3833; color: inherit; border-radius: 3px; padding: 0 2px; }
  .anno { color: #8fb7f5; }

  table { border-collapse: collapse; margin: 10px 0; width: 100%; }
  th, td { border: 1px solid #26292f; padding: 6px 10px; text-align: left; font-size: 13px; }
  th { background: #1d2026; color: #aeb4bd; }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .compare > div { min-width: 0; }
  .compare .tag { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  .compare .before .tag { color: #ff8f8f; }
  .compare .after .tag { color: #89d281; }

  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
  .flow svg { width: 100%; height: auto; max-width: 950px; margin: auto; }
  .box { background: #1d2026; border: 1px solid #3a3f47; border-radius: 8px; padding: 8px 14px; }
  .box.hl { border-color: #2d77e0; }
  .arrow { color: #5c626c; }

  .sec { margin-top: 8px; }
  .lead { font-weight: bold; }
</style>
</head>
<body data-page-id="{{PAGE_ID}}">

<h1>{{TITLE}}</h1>
<div class="subtitle">Page {{PAGE_ID}}</div>

<div class="tldr"><strong>TL;DR</strong><br>{{TLDR}}</div>

<h2>1. The picture</h2>
{{DIAGRAMS}}

<h2>2. Details</h2>
<div class="sec" id="sec-2-1">
  <h3>2.1 {{SECTION_TITLE}}</h3>
  <p class="lead">{{ONE_BOLD_SENTENCE}}</p>
  <p>{{EXPLANATION}}</p>
  <details class="more"><summary>More detail</summary><div>{{EXPANDED_DETAIL}}</div></details>
</div>

<h2>3. Glossary</h2>
<table>
  <tr><th>Term</th><th>Meaning</th></tr>
  <tr><td>{{TERM}}</td><td>{{MEANING}}</td></tr>
</table>

<h2>4. You might ask</h2>
<div class="sec">
{{QA_ITEMS}}
</div>

</body>
</html>
