<animateMotion dur="17.5s" repeatCount="indefinite" path="M130,170 L320,170 L510,170 L700,170 L605,370 L510,170 L700,170 L890,170" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/></circle>
<text font-size="12" text-anchor="middle" y="4" fill="#0b1120" font-weight="700">ant<animateMotion dur="17.5s" repeatCount="indefinite" path="M130,170 L320,170 L510,170 L700,170 L605,370 L510,170 L700,170 L890,170" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/></text></g>
