<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="ui-monospace, Menlo, Consolas, monospace">
<style>
  :root{--bg:#fbfaf7;--fg:#1f2328;--mute:#6b7280;--card:#ffffff;--line:#d0d4da;--ok:#1a7f37;--warn:#b45309;--warnbg:#fff4e0;--okbg:#e7f6ec;--acc:#2563eb;--del:#b91c1c}
  @media (prefers-color-scheme: dark){:root{--bg:#16181c;--fg:#e6e6e6;--mute:#9aa0a6;--card:#1f2228;--line:#3a3f47;--ok:#4ade80;--warn:#fbbf24;--warnbg:#3a2a10;--okbg:#12301d;--acc:#60a5fa;--del:#f87171}}
  .bg{fill:var(--bg)} .fg{fill:var(--fg)} .mute{fill:var(--mute)} .card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .ok{fill:var(--ok)} .warn{fill:var(--warn)} .acc{fill:var(--acc)} .del{fill:var(--del)}
  .t{font-size:14px} .s{font-size:12px} .h{font-size:16px;font-weight:700} .big{font-size:19px;font-weight:700}
  .a{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .x0_25{animation-name:x0_25} .x25_100{animation-name:x25_100} .x0_50{animation-name:x0_50}
  .x50_75{animation-name:x50_75} .x50_100{animation-name:x50_100} .x75_100{animation-name:x75_100}
  .x25_50{animation-name:x25_50} .x0_75{animation-name:x0_75}
  @keyframes x0_25{0%{opacity:1}25%{opacity:0}100%{opacity:0}}
  @keyframes x25_50{0%{opacity:0}25%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes x25_100{0%{opacity:0}25%{opacity:1}100%{opacity:1}}
  @keyframes x0_50{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes x0_75{0%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes x50_75{0%{opacity:0}50%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes x50_100{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
  @keyframes x75_100{0%{opacity:0}75%{opacity:1}100%{opacity:1}}
  .scan{animation:scan 16s infinite linear}
  @keyframes scan{0%,50%{opacity:0;transform:translateX(0)}52%{opacity:1}62%{opacity:1;transform:translateX(250px)}64%,100%{opacity:0;transform:translateX(250px)}}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-12}}
</style>
<rect class="bg" width="900" height="540"/>

<!-- step bar -->
<g class="s">
  <text x="30" y="34" class="h fg">Suspect detection with a lock file (no git)</text>
  <g transform="translate(30,52)">
    <rect width="200" height="26" rx="13" class="card"/><text x="100" y="17" text-anchor="middle" class="fg">1 · accepted</text>
    <rect x="210" width="200" height="26" rx="13" class="card"/><text x="310" y="17" text-anchor="middle" class="fg">2 · parent edited</text>
    <rect x="420" width="200" height="26" rx="13" class="card"/><text x="520" y="17" text-anchor="middle" class="fg">3 · lmx lint compares</text>
    <rect x="630" width="210" height="26" rx="13" class="card"/><text x="735" y="17" text-anchor="middle" class="fg">4 · lmx accept RT-7</text>
    <rect class="a x0_25"   x="0"   width="200" height="26" rx="13" fill="none" stroke="var(--acc)" stroke-width="3"/>
    <rect class="a x25_50"  x="210" width="200" height="26" rx="13" fill="none" stroke="var(--acc)" stroke-width="3"/>
    <rect class="a x50_75"  x="420" width="200" height="26" rx="13" fill="none" stroke="var(--acc)" stroke-width="3"/>
    <rect class="a x75_100" x="630" width="210" height="26" rx="13" fill="none" stroke="var(--acc)" stroke-width="3"/>
  </g>
</g>

<!-- theory file -->
<rect x="30" y="100" width="400" height="330" rx="10" class="card"/>
<text x="46" y="124" class="t mute">theory.org  (what people edit)</text>

<rect x="50" y="140" width="360" height="100" rx="8" class="card"/>
<text x="66" y="164" class="h fg">* THEOREM RT-3</text>
<text class="t fg a x0_25" x="66" y="192">Lint reads every tracked file.</text>
<text class="t fg a x25_100" x="66" y="192">Lint reads every <tspan class="acc" font-weight="700">.org</tspan> file.</text>
<text x="66" y="222" class="s mute">hash now:</text>
<text class="s fg a x0_25" x="140" y="222" font-weight="700">a1b2c3</text>
<text class="s acc a x25_100" x="140" y="222" font-weight="700">f00d42  (text changed)</text>

<line x1="230" y1="240" x2="230" y2="290" stroke="var(--mute)" stroke-width="2" class="flow"/>
<text x="240" y="270" class="s mute">:NEEDS: RT-3</text>

<g>
  <rect x="50" y="290" width="360" height="120" rx="8" class="card"/>
  <rect class="a x50_75" x="50" y="290" width="360" height="120" rx="8" fill="var(--warnbg)" stroke="var(--warn)" stroke-width="3"/>
  <rect class="a x0_50" x="50" y="290" width="360" height="120" rx="8" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
  <rect class="a x75_100" x="50" y="290" width="360" height="120" rx="8" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
  <text x="66" y="314" class="h fg">* LEMMA RT-7</text>
  <text x="66" y="342" class="t fg">Lint skips untracked files.</text>
  <g class="a x0_50"><text x="66" y="388" class="t ok" font-weight="700">✓ up to date</text></g>
  <g class="a x50_75"><text x="66" y="388" class="t warn" font-weight="700">⚠ SUSPECT: parent RT-3 changed</text></g>
  <g class="a x75_100"><text x="66" y="388" class="t ok" font-weight="700">✓ reviewed, up to date</text></g>
</g>

<!-- compare scanner -->
<g class="scan"><rect x="420" y="150" width="40" height="40" rx="20" fill="var(--acc)" opacity=".85"/><text x="440" y="175" text-anchor="middle" class="s" fill="#fff" font-weight="700">=?</text></g>

<!-- lock file -->
<rect x="470" y="100" width="400" height="330" rx="10" class="card"/>
<text x="486" y="124" class="t mute">lemmax.lock  (written only by lmx)</text>
<rect x="490" y="140" width="360" height="100" rx="8" class="card"/>
<text x="506" y="166" class="t fg">RT-3</text>
<text class="t fg a x0_75" x="560" y="166" font-weight="700">a1b2c3</text>
<text class="t ok a x75_100" x="560" y="166" font-weight="700">f00d42</text>
<text class="s mute a x0_75" x="506" y="190">"Lint reads every tracked file."</text>
<text class="s mute a x75_100" x="506" y="190">"Lint reads every .org file."</text>
<text x="506" y="226" class="t fg">RT-7  needs RT-3@</text>
<text class="t fg a x0_75" x="646" y="226" font-weight="700">a1b2c3</text>
<text class="t ok a x75_100" x="646" y="226" font-weight="700">f00d42</text>

<!-- diff panel in step 3 -->
<g class="a x50_75">
  <rect x="490" y="260" width="360" height="150" rx="8" fill="var(--warnbg)" stroke="var(--warn)" stroke-width="2"/>
  <text x="506" y="284" class="t warn" font-weight="700">a1b2c3 ≠ f00d42 → show diff</text>
  <text x="506" y="314" class="t del">- Lint reads every tracked file.</text>
  <text x="506" y="340" class="t ok">+ Lint reads every .org file.</text>
  <text x="506" y="374" class="s mute">diff comes from the stored text,</text>
  <text x="506" y="392" class="s mute">no history needed</text>
</g>
<g class="a x0_50">
  <rect x="490" y="260" width="360" height="150" rx="8" fill="var(--okbg)" stroke="var(--ok)" stroke-width="2"/>
  <text x="506" y="290" class="t ok" font-weight="700">every needs@hash matches</text>
  <text x="506" y="318" class="s mute">the lock remembers what was</text>
  <text x="506" y="336" class="s mute">accepted: hash + text</text>
</g>
<g class="a x75_100">
  <rect x="490" y="260" width="360" height="150" rx="8" fill="var(--okbg)" stroke="var(--ok)" stroke-width="2"/>
  <text x="506" y="290" class="t ok" font-weight="700">lock rewritten by lmx accept</text>
  <text x="506" y="318" class="s mute">new hash + new text stored;</text>
  <text x="506" y="336" class="s mute">RT-7 is clear again</text>
</g>

<!-- captions -->
<g class="t">
  <text class="a x0_25 fg" x="30" y="470">1. RT-7 was reviewed against RT-3. The lock stores RT-3's hash and text.</text>
  <text class="a x25_50 fg" x="30" y="470">2. Someone edits RT-3 in any editor. Its hash changes; nothing else does yet.</text>
  <text class="a x50_75 fg" x="30" y="470">3. lmx lint rehashes RT-3, sees it differ from RT-7's need, flags it and shows the diff.</text>
  <text class="a x75_100 fg" x="30" y="470">4. A person checks RT-7 still holds, runs lmx accept RT-7, and the lock moves forward.</text>
  <text class="s mute" x="30" y="500">Trivial typo? lmx accept --trivial RT-3 updates RT-3's hash without flagging its children.</text>
</g>
</svg>
